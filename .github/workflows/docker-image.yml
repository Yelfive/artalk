name: Docker Image CI

on:
  push:
    branches: [ "work" ]
  pull_request:
    branches: [ "work" ]

jobs:

  build:

    runs-on: ubuntu-latest

    env:
      IMAGE_REGISTRY: registry.cn-hongkong.aliyuncs.com
      IMAGE_TAG: registry.cn-hongkong.aliyuncs.com/yelfive/artalk:${{ github.sha }}

    steps:
    - uses: actions/checkout@v4
    
    # Log in to Docker registry
    - name: Log in to Docker registry
      uses: docker/login-action@v3
      with:
        registry: registry.cn-hongkong.aliyuncs.com
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Build and push Docker image using the variable
    # - name: Build and push Docker image
    #   uses: docker/build-push-action@v6
    #   with:
    #     push: true
    #     tags: ${{ env.IMAGE_NAME }}
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag  ${{ env.IMAGE_TAG }}


    - name: Push to docker regsitry
      run: docker push ${{ env.IMAGE_TAG }}
