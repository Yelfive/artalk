name: Docker Image CI

on:
  push:
    branches: [ "work" ]
  pull_request:
    branches: [ "work" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag registry.cn-hongkong.aliyuncs.com/yelfive/artalk:$(date +%s)
